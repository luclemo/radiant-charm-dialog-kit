name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages (Actions source) on first run so no manual Settings step is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          # Static site — publish the repo root as-is.
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
